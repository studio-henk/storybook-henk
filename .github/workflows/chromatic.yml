name: "Chromatic Publish"

on: push

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout studio-henk
        env:
          DEPLOY_KEY: ${{ secrets.STUDIO_HENK_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan github.com >> ~/.ssh/known_hosts
          # git clone git@github.com:studio-henk/studio-henk.git studio-henk
          git clone --branch storybook/chromatic-deploy git@github.com:studio-henk/studio-henk.git studio-henk

      - name: Recreate Shopify symlinks
        run: |
          rm -f src/snippets/henk-button.liquid
          rm -f src/sections/henk-section-splitscreen.liquid
          rm -f src/snippets/henk-snippet-splitscreen.liquid
          rm -f public/assets/henk-critical.css
          rm -f public/assets/henk-css-variables.css
          rm -f public/assets/henk-base.css
          rm -f public/assets/_henk-section.css
          rm -f src/snippets/henk-fonts.liquid
          rm -f src/snippets/henk-video.liquid
          rm -f src/snippets/henk-snippet-double-media.liquid
          rm -f src/sections/henk-section-double-media.liquid
          rm -f src/sections/henk-section-swiper.liquid
          rm -f src/snippets/henk-snippet-swiper.liquid
          rm -f src/snippets/henk-collection-item.liquid
          rm -f public/assets/henk-collection-grid.css


          ln -s "$GITHUB_WORKSPACE/studio-henk/snippets/henk-button.liquid" src/snippets/henk-button.liquid
          ln -s "$GITHUB_WORKSPACE/studio-henk/sections/henk-section-splitscreen.liquid" src/sections/henk-section-splitscreen.liquid
          ln -s "$GITHUB_WORKSPACE/studio-henk/snippets/henk-snippet-splitscreen.liquid" src/snippets/henk-snippet-splitscreen.liquid
          ln -s "$GITHUB_WORKSPACE/studio-henk/assets/henk-critical.css" public/assets/henk-critical.css
          ln -s "$GITHUB_WORKSPACE/studio-henk/assets/henk-css-variables.css" public/assets/henk-css-variables.css
          ln -s "$GITHUB_WORKSPACE/studio-henk/assets/henk-base.css" public/assets/henk-base.css
          ln -s "$GITHUB_WORKSPACE/studio-henk/assets/_henk-section.css" public/assets/_henk-section.css
          ln -s "$GITHUB_WORKSPACE/studio-henk/snippets/henk-fonts.liquid" src/snippets/henk-fonts.liquid
          ln -s "$GITHUB_WORKSPACE/studio-henk/snippets/henk-video.liquid" src/snippets/henk-video.liquid
          ln -s "$GITHUB_WORKSPACE/studio-henk/snippets/henk-snippet-double-media.liquid" src/snippets/henk-snippet-double-media.liquid
          ln -s "$GITHUB_WORKSPACE/studio-henk/sections/henk-section-double-media.liquid" src/sections/henk-section-double-media.liquid
          ln -s "$GITHUB_WORKSPACE/studio-henk/sections/henk-section-swiper.liquid" src/sections/henk-section-swiper.liquid
          ln -s "$GITHUB_WORKSPACE/studio-henk/snippets/henk-snippet-swiper.liquid" src/snippets/henk-snippet-swiper.liquid
          ln -s "$GITHUB_WORKSPACE/studio-henk/snippets/henk-collection-item.liquid" src/snippets/henk-collection-item.liquid
          ln -s "$GITHUB_WORKSPACE/studio-henk/assets/henk-collection-grid.css" public/assets/henk-collection-grid.css

          for font in "$GITHUB_WORKSPACE"/studio-henk/assets/*.{woff,woff2}; do
            [ -e "$font" ] || continue
            ln -sf "$font" "public/assets/$(basename "$font")"
          done

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - uses: chromaui/action@latest
        with:
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          token: ${{ secrets.GITHUB_TOKEN }}
          exitOnceUploaded: true
